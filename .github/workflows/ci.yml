name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PADDLE_PDX_DISABLE_MODEL_SOURCE_CHECK: "True"
  UV_FROZEN: "true"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
          enable-cache: true
      - run: uv sync --python 3.13 --extra dev
      - run: uv run ruff check .
      - run: uv lock --check

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
          enable-cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ffmpeg
      - run: uv sync --python ${{ matrix.python }} --extra dev
      - run: >-
          uv run pytest
          --cov=redact_video
          --cov-report=term-missing
          --cov-fail-under=85
          -q

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
          enable-cache: true
      - run: uv build
      - run: uv venv /tmp/video-redactor-wheel --python 3.13
      - run: >-
          uv pip install
          --python /tmp/video-redactor-wheel/bin/python
          --find-links dist
          "video-redactor[api]"
      - run: /tmp/video-redactor-wheel/bin/redact-video --version
      - run: >-
          /tmp/video-redactor-wheel/bin/python
          -c 'from redact_video.api.app import create_app; assert create_app().title == "Video Redactor API"'
      - run: /tmp/video-redactor-wheel/bin/redact-video-acceptance --help

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.14"
          enable-cache: true
      - run: sudo apt-get update
      - run: sudo apt-get install --yes ffmpeg
      - run: uv sync --python 3.13 --extra dev
      - run: >-
          uv run python -m benchmarks.synthetic
          --scenario static_landscape
          --output synthetic-benchmark.json
          --max-realtime-factor 20

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: docker build --tag video-redactor:ci .
      - run: docker run --rm video-redactor:ci --help
      - run: >-
          docker run --rm
          --entrypoint python
          --volume "${PWD}/config.example.yaml:/config.yaml:ro"
          video-redactor:ci
          -c 'from pathlib import Path; from redact_video.config_loader import load_app_config; assert load_app_config(Path("/config.yaml")).output.codec == "libx264"'
      - name: Verify non-root runtime
        run: test "$(docker run --rm --entrypoint id video-redactor:ci -u)" != "0"
      - name: Smoke API container
        run: |
          docker run --rm --detach \
            --name video-redactor-ci-api \
            --publish 8000:8000 \
            --env REDACT_VIDEO_API_HOST=0.0.0.0 \
            --entrypoint redact-video-api \
            video-redactor:ci
          trap 'docker stop video-redactor-ci-api' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:8000/healthz; then
              exit 0
            fi
            sleep 1
          done
          docker logs video-redactor-ci-api
          exit 1
