[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "video-redactor"
version = "0.1.0"
description = "Headless payment-card redaction for screen-recording videos"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Video Redactor contributors" }]
keywords = [
  "card-redaction",
  "computer-vision",
  "ocr",
  "privacy",
  "video",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
  "Topic :: Security",
]
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]
ocr = [
  "onnxruntime>=1.23,<2; python_version < '3.14'",
  "paddleocr>=3.7,<4; python_version < '3.14'",
  "paddlepaddle>=3,<4; python_version < '3.14'",
]
ocr-benchmark = [
  "onnxruntime>=1.23,<2; python_version < '3.14'",
  "paddleocr>=3.7,<4; python_version < '3.14'",
  "paddlepaddle>=3,<4; python_version < '3.14'",
]
dev = [
  "fastapi>=0.115,<1",
  "httpx2>=2,<3",
  "python-multipart>=0.0.9,<1",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.16,<0.17",
]

[project.scripts]
redact-video = "redact_video.cli:app"
redact-video-api = "redact_video.api.app:run"
redact-video-acceptance = "redact_video.acceptance:app"

[project.urls]
Homepage = "https://github.com/Ruth-Soma/redact-video"
Repository = "https://github.com/Ruth-Soma/redact-video.git"
Issues = "https://github.com/Ruth-Soma/redact-video/issues"
Changelog = "https://github.com/Ruth-Soma/redact-video/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/redact_video"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: requires local FFmpeg and performs media encoding",
  "ocr_runtime: requires PaddleOCR/PaddlePaddle and may download model weights",
]

[tool.ruff]
line-length = 88
extend-exclude = ["Video Card Redaction Engine — V1 Build Specification.md"]

[tool.coverage.run]
branch = true
source = ["redact_video"]

[tool.coverage.report]
show_missing = true
skip_covered = true
